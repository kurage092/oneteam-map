<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ワンチーム食事会マップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">

<style>
/* VOICE: 仲間内のゆるい遊び場。管理画面より「すごろく盤」に近い
   IDEA: 本物の地図が盤面、動物アバターがコマ
   PICTURE: 全画面の3D地図。UIは下からのシートと小さなチップだけ
   COLOUR and TYPE: 地図の色を主役に、UIは白地＋墨色、アクセントは朱(#e8533f)。M PLUS Rounded 1c
   LAYOUT: スマホ縦画面基準。上に名前チップ、右下に追加ボタン、下にシート */
:root{--ink:#1d2a33;--sub:#5d6b75;--bg:#fff;--line:#e3e7ea;--acc:#e8533f;--wish:#f2a541;--done:#2f9e6e;--r:18px}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;font:16px/1.5 "M PLUS Rounded 1c",system-ui,sans-serif;color:var(--ink);background:#dfe9ec}
button,input,select{font:inherit;color:inherit}
#map{position:fixed;inset:0}
.top{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;gap:8px;align-items:center;z-index:5;pointer-events:none}
.top>*{pointer-events:auto}
.chip{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:999px;padding:4px 14px 4px 4px;box-shadow:0 2px 10px #0002;border:0;min-height:44px;cursor:pointer;font-weight:600}
.chip img{width:36px;height:36px;border-radius:50%;background:#f1f4f5}
.brand{font-weight:600;background:var(--bg);border-radius:999px;padding:8px 14px;box-shadow:0 2px 10px #0002;font-size:15px}
.sp{flex:1}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:var(--bg);box-shadow:0 2px 10px #0002;font-weight:600;cursor:pointer}
.demo{position:fixed;top:calc(env(safe-area-inset-top) + 62px);left:10px;z-index:4;background:#1d2a33e6;color:#fff;font-size:12px;border-radius:10px;padding:4px 10px}
.fab{position:fixed;right:16px;bottom:calc(var(--sh,168px) + 16px);transition:bottom .25s ease,opacity .2s;z-index:5;height:56px;padding:0 22px;border-radius:28px;border:0;background:var(--acc);color:#fff;font-weight:600;font-size:17px;box-shadow:0 6px 18px #e8533f66;cursor:pointer}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-radius:var(--r) var(--r) 0 0;box-shadow:0 -4px 24px #0002;height:168px;display:none;flex-direction:column;transition:height .25s ease,transform .25s ease}
.sheet.on{display:flex}.sheet.drag{transition:none}.sheet.hide{transform:translateY(110%)}
.shead{flex:none;position:relative;padding:8px 16px 0;touch-action:none;cursor:grab}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;text-align:center;border:0;background:none;padding:8px 0;min-height:48px;font-weight:600;color:var(--sub);border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
.chip.guide{padding:4px 16px}
.legend li{display:flex;gap:16px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.legend img{width:56px;height:56px;border-radius:50%;background:#f1f4f5;flex:none}
details.team{margin-top:24px;border-top:1px solid var(--line);padding-top:8px}details.team summary{min-height:48px;display:flex;align-items:center;font-weight:600;cursor:pointer;color:var(--sub)}
.pitch{background:#fff7ec;border-radius:12px;padding:8px 16px;margin:8px 0;white-space:pre-wrap}
.who{display:flex;align-items:center;gap:8px;margin:8px 0}.who img{width:40px;height:40px;border-radius:50%;background:#f1f4f5}
.sheet.detail .tabs{display:none}.sheet:not(.detail) .x{display:none}.sheet.detail .shead{min-height:56px}
#sheetBody{flex:1;overflow:auto;overscroll-behavior:contain;padding:8px 16px calc(env(safe-area-inset-bottom) + 24px)}
.mapbtn{position:fixed;right:16px;bottom:calc(var(--sh,168px) + 88px);z-index:5;font-size:13px;transition:bottom .25s ease,opacity .2s}
.full .fab,.full .mapbtn{opacity:0;pointer-events:none}
.maplibregl-ctrl-bottom-right{bottom:var(--sh,168px)!important;transition:bottom .25s ease}
@media (min-width:768px){.sheet{left:16px;right:auto;width:440px;bottom:16px;border-radius:var(--r)}}
.undo{position:fixed;left:16px;right:16px;bottom:calc(var(--sh,168px) + 16px);z-index:30;display:none;align-items:center;gap:16px;background:var(--ink);color:#fff;border-radius:12px;padding:8px 8px 8px 16px;max-width:440px}
.undo.on{display:flex}.undo span{flex:1;font-size:14px}.undo button{border:0;background:none;color:#ffd1c8;font-weight:600;min-height:44px;padding:0 8px;cursor:pointer}
.ltools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}

.tbl{overflow-x:auto;margin:8px 0}

.sheet h2{padding-right:48px}

label.f{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
input[type=text],input[type=url],input[type=password],select{width:100%;min-height:48px;border-radius:12px;border:1px solid #cfd6db;padding:0 12px;font-size:16px;background:#fff}

#pickbar{flex-wrap:wrap}#pickbar p{flex:1 1 100%;margin:0 4px 2px;font-size:14px;font-weight:600;line-height:1.5}#pickbar .btn{flex:1}

.toast.on{opacity:1}
.maplibregl-ctrl-attrib{font-size:10px}
.bar button.hot{background:var(--ink);color:#fff;border-color:var(--ink)}
.mini{min-height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:0 12px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{width:44px;min-height:44px;border:0;background:#fff;font-size:18px;font-weight:600;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.list li .mini{flex:none;border:1px solid var(--line);background:#fff;padding:0 12px;text-align:center}
.list li .seg button{flex:none;width:44px;text-align:center;background:#fff}
.list li .seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.drow>div:first-child{min-width:120px}
.evnav{margin-right:52px;justify-content:space-between}
.drow{flex-wrap:wrap}.drow.fin{background:#eefaf4}
.orgrow{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px;border-radius:14px;background:#f5f7f8}
.orgrow img{width:52px;height:52px;border-radius:50%;background:#fff}
.checks{list-style:none;margin:0;padding:0}.checks label{display:flex;align-items:center;gap:10px;min-height:40px}.checks input{width:22px;height:22px}
.card{border:1px solid var(--line);border-radius:16px;padding:12px}
.lnk{display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit;margin-top:8px}
.btn.pri.lnk{color:#fff}
.big{font-size:26px;font-weight:600;margin:8px 0 0}
.wheel{margin:14px 0;min-height:90px;border-radius:18px;background:#1d2a33;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:600;padding:10px}
.wheel.hit{background:var(--acc)}
textarea{width:100%;min-height:72px;border-radius:12px;border:1px solid #cfd6db;padding:10px;font:inherit;font-size:16px}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>

<script type="module">
import * as THREE from 'three';

/* ============ 設定 ============ */
// Supabase につなぐときはここに URL と anon key を入れる。空ならデモモード（端末内保存）
const SUPABASE_URL = 'https://czahuzhxuersojzuliat.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Mw0iVK6BAIOLcT3j9_79Qg_9Hyo7Ay1';
const MAP_STYLE = 'https://tiles.openfreemap.org/styles/liberty';
const DEFAULT_OFFICE = {lat: 35.6812, lng: 139.7671};
const AREA_KM = 12; // 電車30分の目安（半径）。正確な圏内は駅の登録で扱う（P2）

const ANIMALS = [
  ['dog','いぬ'],['cat','ねこ'],['bear','くま'],['rabbit','うさぎ'],
  ['panda','パンダ'],['fox','きつね'],['pig','ぶた'],['frog','かえる'],
  ['penguin','ペンギン'],['koala','コアラ'],['lion','ライオン'],['monkey','さる']];
const ANIMAL_NAME = Object.fromEntries(ANIMALS); // 似顔アバターの名前は後で PEOPLE から足す
const GENRES = ['和食','寿司','焼肉','中華','イタリアン','フレンチ','居酒屋','エスニック','カレー','ラーメン','その他'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
async function sha(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('oneteam:' + s.trim()));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('on'),2200); }

/* ============ データ層 ============ */
// どちらのストアも同じ形の data を返す:
// {settings:{passHash,officeLat,officeLng}, members:[{id,nickname,animal}], restaurants:[{id,name,url,genre,lat,lng,status,createdBy}], wishes:[{r,m}], visits:[{r,m}]}
class LocalStore {
  constructor(){ this.key='oneteam-demo-v3'; this.subs=[]; }
  async init(){
    try { this.d = JSON.parse(localStorage.getItem(this.key)); } catch { this.d = null; }
    if(!this.d) this.d = await demoSeed();
    for(const t of ['events','event_dates','date_answers']) this.d[t] ||= [];
    this.save(false);
  }
  save(emit=true){ try{ localStorage.setItem(this.key, JSON.stringify(this.d)); }catch{} if(emit) this.subs.forEach(f=>f()); }
  get data(){ return this.d; }
  onChange(f){ this.subs.push(f); }
  async setPass(h){ this.d.settings.passHash=h; this.save(); }
  async setOffice(lat,lng){ Object.assign(this.d.settings,{officeLat:lat,officeLng:lng}); this.save(); }
  async addMember(m){ const x={id:uid(),...m}; this.d.members.push(x); this.save(); return x; }
  async updateMember(id,p){ Object.assign(this.d.members.find(m=>m.id===id),p); this.save(); }
  async addRestaurant(r){ const x={id:uid(),status:'wish',...r}; this.d.restaurants.push(x); this.save(); return x; }
  async updateRestaurant(id,p){ Object.assign(this.d.restaurants.find(r=>r.id===id),p); this.save(); }
  async deleteRestaurant(id){ const d=this.d; d.restaurants=d.restaurants.filter(r=>r.id!==id); d.wishes=d.wishes.filter(w=>w.r!==id); d.visits=d.visits.filter(v=>v.r!==id); this.save(); }
  async setWish(r,m,on){ const d=this.d; d.wishes=d.wishes.filter(w=>!(w.r===r&&w.m===m)); if(on) d.wishes.push({r,m}); this.save(); }
  async setVisits(r,ms){ const d=this.d; d.visits=d.visits.filter(v=>v.r!==r); ms.forEach(m=>d.visits.push({r,m})); this.save(); }
  async reset(){ this.d = await demoSeed(); this.save(); }
  async setSettings(p){ Object.assign(this.d.settings,p); this.save(); }
  async ins(t,row){ const x={id:uid(),...row}; (this.d[t] ||= []).push(x); this.save(); return x; }
  async upd(t,id,p){ Object.assign(this.d[t].find(x=>x.id===id),p); this.save(); }
  async del(t,f){ this.d[t]=(this.d[t]||[]).filter(x=>!Object.entries(f).every(([k,v])=>x[k]===v)); this.save(); }
  async ups(t,row,keys){ const a=(this.d[t] ||= []); const ex=a.find(x=>keys.every(k=>x[k]===row[k])); if(ex) Object.assign(ex,row); else a.push({...row}); this.save(); }
}

class SupaStore {
  constructor(){ this.subs=[]; this.d=null; }
  async init(){
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm');
    this.sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    await this.reload();
    let t; this.sb.channel('all').on('postgres_changes',{event:'*',schema:'public'},()=>{ clearTimeout(t); t=setTimeout(()=>this.reload(true),300); }).subscribe();
  }
  async reload(emit){
    const q = n => this.sb.from(n).select('*');
    const [s,m,r,w,v,ev,ed,da] = await Promise.all([q('settings'),q('members'),q('restaurants'),q('wishes'),q('visits'),q('events'),q('event_dates'),q('date_answers')]);
    const bad = [s,m,r,w,v].find(x=>x.error); if(bad) throw bad.error;

  [-1,1].forEach(sx=>head.add(part('s',SKIN,[.39*sx,-.05,-.02],[.05,.08,.04],[0,.3*sx,0])));    // 耳
  body.add(part('cy',SKIN,[0,.74,0],[.09,.1,.09]));                                     // 首
  // 髪：頭頂は大きめのボリューム、毛束はとがった房で無造作に
  const H=(geo,pos,scl,rot,col=HAIR)=>head.add(part(geo,col,pos,scl,rot));
  H('s',[0,.15,-.07],[.45,.4,.43]);                       // 頭全体
  H('s',[0,.32,.0],[.42,.22,.37]);                         // 頭頂のボリューム
  H('s',[0,.02,-.2],[.39,.3,.27]);                        // 後頭部
  // 後ろと横：下向きの房（えりあしは短め）
  for(let i=0;i<9;i++){ const a=(-.8+i*.2)*Math.PI; const x=Math.sin(a)*.36, z=Math.cos(a)*.33-.04;
    if(z>-.02) continue; H('c',[x,-.14,z],[.08,.2,.06],[Math.PI+(-z*.4),a,0]); }
  [-1,1].forEach(sx=>{ H('c',[.36*sx,0,-.08],[.07,.18,.06],[Math.PI,0,-.03*sx]); });  // 耳の上にかかる横髪
  // 前髪：センターパート。分け目から左右に、先がとがった房が流れる。見る人の右側は目の高さまで長め
  const bang=(x,y,z,len,tilt,w)=>H('c',[x,y,z],[w,len,.05],[Math.PI-.3+Math.abs(x)*1.1,0,tilt]);   // 外側の房ほど頭に沿わせる
  [[-1,[[.07,.17,.38,.3,-.06,.13],[.18,.15,.36,.3,-.1,.13],[.25,.1,.32,.26,-.04,.1],[.3,.04,.25,.2,.04,.07]]],
   [ 1,[[.06,.15,.39,.38,.1,.13],[.17,.13,.37,.38,.16,.13],[.27,.08,.31,.32,.15,.12],[.32,.01,.22,.24,.08,.09]]]]
   .forEach(([sx,list])=>list.forEach(([x,y,z,len,t,w])=>bang(x*sx-.015,y,z,len,t,w)));
  [-1,1].forEach(sx=>H('s',[.15*sx,.27,.28],[.17,.09,.12],[-.5,0,-.35*sx]));             // 分け目の両側の毛の根元
  root.userData={body, head, arms, kind, drapes};
  return root;
}

function makeAnimal(kind){
  if(String(kind).startsWith('p_')) return makePerson(kind);
  const L = LOOK[kind] || LOOK.dog, fur=L.fur, limb=L.limb||fur;
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  // 胴（2頭身）
  body.add(part('s',fur,[0,.42,0],[.36,.4,.32]));
  body.add(part('s',L.belly,[0,.38,.17],[.24,.28,.16]));
  // 足
  body.add(part('s',limb,[-.15,.06,.04],[.12,.08,.15])); body.add(part('s',limb,[.15,.06,.04],[.12,.08,.15]));
  // 腕（肩にピボット）
  const arms = [-1,1].map(sx=>{ const piv=new THREE.Group(); piv.position.set(.3*sx,.6,0);
    piv.add(part('s',limb,[.06*sx,-.16,0],[.09,.18,.09])); body.add(piv); return piv; });
  // 頭
  const head = new THREE.Group(); head.position.y = 1.05; body.add(head);
  const hc = kind==='panda'?0xffffff:fur;
  head.add(part('s',hc,[0,0,0],[.5,.44,.44]));
  // 目・ほっぺ
  const eyeY = kind==='frog'? .34 : .02, eyeX = kind==='frog'? .2 : .17, eyeZ = kind==='frog'? .12 : .4;
  if(kind==='frog'){ [-1,1].forEach(s=>head.add(part('s',fur,[eyeX*s,.3,.1],[.15,.15,.15]))); }
  if(kind==='panda'){ [-1,1].forEach(s=>head.add(part('s',0x2b2b2b,[.17*s,.02,.36],[.11,.13,.06],[0,0,.5*s]))); }
  [-1,1].forEach(s=>{ head.add(part('s',0x1b1b1b,[eyeX*s,eyeY,eyeZ+ (kind==='frog'?.12:0)],[.06,.075,.04]));
    head.add(part('s',0xffffff,[eyeX*s+.02,eyeY+.03,eyeZ+.035+(kind==='frog'?.12:0)],[.02,.02,.01]));
    if(kind!=='penguin') head.add(part('s',0xff9aa8,[.3*s,-.12,.3],[.07,.045,.02])); });
  // 種類ごとの特徴（シルエットで分かる部分）
  const ear = (geo,col,x,y,z,sc,rot)=>[-1,1].forEach(s=>head.add(part(geo,col,[x*s,y,z],sc,rot?[rot[0],rot[1],rot[2]*s]:null)));
  const snout = (col,nose)=>{ head.add(part('s',col,[0,-.1,.36],[.18,.13,.12])); head.add(part('s',nose,[0,-.04,.47],[.06,.045,.04])); };
  switch(kind){
    case 'dog': ear('s',0x8a5a2f,.4,-.02,0,[.12,.24,.08],[0,0,.35]); snout(L.belly,0x222222); break;
    case 'cat': ear('c',fur,.28,.38,0,[.14,.24,.1],[0,0,-.35]); head.add(part('s',0xff8fa0,[0,-.06,.43],[.04,.03,.03])); break;
    case 'bear': ear('s',fur,.32,.32,0,[.13,.13,.08]); snout(L.belly,0x3a2a20); break;
    case 'rabbit': ear('s',fur,.14,.62,0,[.09,.32,.07],[0,0,-.1]); ear('s',0xffc1cc,.14,.62,.05,[.05,.24,.03],[0,0,-.1]); head.add(part('s',0xff8fa0,[0,-.06,.43],[.04,.03,.03])); break;
    case 'panda': ear('s',0x2b2b2b,.32,.32,0,[.13,.13,.08]); head.add(part('s',0x2b2b2b,[0,-.08,.43],[.05,.035,.03])); break;
    case 'fox': ear('c',fur,.26,.42,0,[.15,.32,.1],[0,0,-.25]); head.add(part('c',0xffffff,[0,-.1,.42],[.14,.22,.14],[Math.PI/2,0,0])); head.add(part('s',0x222222,[0,-.1,.54],[.04,.035,.03])); break;
    case 'pig': ear('c',fur,.3,.34,0,[.12,.16,.08],[0,0,-.5]); head.add(part('cy',0xf08aa0,[0,-.08,.42],[.13,.08,.13],[Math.PI/2,0,0])); [-1,1].forEach(s=>head.add(part('s',0x9b4a5a,[.045*s,-.08,.465],[.025,.03,.01]))); break;
    case 'frog': head.add(part('s',0xc0405a,[0,-.16,.38],[.16,.03,.05])); break;
    case 'penguin': head.add(part('s',0xffffff,[0,-.04,.2],[.36,.3,.28])); head.add(part('c',0xf3a43a,[0,-.08,.48],[.08,.16,.08],[Math.PI/2,0,0])); break;
    case 'koala': ear('s',0xb9c0c6,.42,.16,0,[.2,.2,.1]); ear('s',0xeef0f2,.42,.16,.05,[.13,.13,.06]); head.add(part('s',0x2b2b2b,[0,-.05,.42],[.09,.12,.06])); break;
    case 'lion': { const mane=part('t',0xc9792c,[0,0,-.02],[.5,.5,.6]); head.add(mane); head.children[0].scale.set(.44,.4,.4); ear('s',fur,.28,.3,.08,[.08,.08,.05]); snout(L.belly,0x5a3a20); break; }
    case 'monkey': ear('s',0xf1d2b0,.46,0,0,[.12,.14,.06]); head.add(part('s',0xf1d2b0,[0,-.05,.3],[.34,.3,.2])); head.add(part('s',0x5a3a20,[0,-.06,.47],[.04,.03,.02])); break;
  }
  root.userData = {body, head, arms, kind};
  return root;
}

let _qTex=null;
const avatarSize = z => Math.min(1, Math.max(.3, (z-11.5)/3.5));   // 地図を引くとキャラを小さく（ズーム15で原寸）
const _bub={};
function bubble(text, x, y, z){ // 吹き出し（常に画面の方を向く板）
  if(!_bub[text]){ const c=document.createElement('canvas'); c.width=256; c.height=96; const g=c.getContext('2d');
    g.fillStyle='#fff'; g.strokeStyle='#e8533f'; g.lineWidth=6; g.beginPath(); g.roundRect(6,6,244,66,24); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(112,70); g.lineTo(128,92); g.lineTo(144,70); g.fill(); g.fillStyle='#1d2a33'; g.font='bold 34px sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,128,40);
    const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; _bub[text]=new THREE.MeshBasicMaterial({map:t, transparent:true, depthTest:false}); }
  const m=new THREE.Mesh(new THREE.PlaneGeometry(2.2,.83), _bub[text]); m.position.set(x,y,z); m.rotation.x=-.75; m.renderOrder=10; return m; }   // 斜め上から見るので、少し後ろに倒して読みやすく
function qTex(){ if(_qTex) return _qTex; const c=document.createElement('canvas'); c.width=c.height=128; const x=c.getContext('2d');
  x.fillStyle='#fff'; x.beginPath(); x.arc(64,60,54,0,Math.PI*2); x.fill(); x.strokeStyle='#e8533f'; x.lineWidth=8; x.stroke();
  x.fillStyle='#e8533f'; x.font='bold 80px sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('?',64,64);
  _qTex=new THREE.CanvasTexture(c); _qTex.colorSpace=THREE.SRGBColorSpace; return _qTex; }
// 選択画面用のサムネイル（同じモデルを小さく描いて画像にする）
const thumbs = {};
function buildThumbs(){
  const cv = document.createElement('canvas'); cv.width = cv.height = 160;
  const r = new THREE.WebGLRenderer({canvas:cv, antialias:true, alpha:true, preserveDrawingBuffer:true});
  const sc = new THREE.Scene(); sc.add(new THREE.HemisphereLight(0xffffff,0x8899aa,1.6)); const dl=new THREE.DirectionalLight(0xffffff,1.6); dl.position.set(1,2,3); sc.add(dl);
  const cam = new THREE.PerspectiveCamera(30,1,.1,20); cam.position.set(0,1.1,4.2); cam.lookAt(0,.85,0);

  r.dispose();
}

const map = new maplibregl.Map({container:'map', style:MAP_STYLE, center:[DEFAULT_OFFICE.lng,DEFAULT_OFFICE.lat], zoom:13.6, pitch:50, maxPitch:65, attributionControl:{compact:true}});

function circle(lat,lng,km){ const pts=[]; for(let i=0;i<=64;i++){ const a=i/64*2*Math.PI; pts.push([lng + km/(111.32*Math.cos(lat*Math.PI/180))*Math.cos(a), lat + km/110.57*Math.sin(a)]); } return {type:'Feature',geometry:{type:'Polygon',coordinates:[pts]}}; }

function drawArea(){
  const s=D().settings; officeMarker.setLngLat([s.officeLng,s.officeLat]).addTo(map);
  const src = map.getSource('area'); const data = circle(s.officeLat,s.officeLng,AREA_KM);
  if(src) src.setData(data); else {
    map.addSource('area',{type:'geojson',data});
    map.addLayer({id:'area-fill',type:'fill',source:'area',paint:{'fill-color':'#e8533f','fill-opacity':.05}});
    map.addLayer({id:'area-line',type:'line',source:'area',paint:{'line-color':'#e8533f','line-width':2,'line-dasharray':[2,2],'line-opacity':.7}});
  }

function drawPins(){
  const seen = new Set();
  for(const r of D().restaurants){
    seen.add(r.id);
    let p = pins.get(r.id);
    if(!p){ const el=document.createElement('div'); el.className='pin'; el.innerHTML='<b></b><i></i>'; el.addEventListener('click',e=>{e.stopPropagation(); openShop(r.id);});
      p = new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([r.lng,r.lat]).addTo(map); pins.set(r.id,p); }
    p.setLngLat([r.lng,r.lat]); const el=p.getElement(); el.classList.remove('wish','visited'); el.classList.add(r.status); el.querySelector('b').textContent=r.name; el.setAttribute('aria-label',r.name);
  }
  for(const [id,p] of pins) if(!seen.has(id)){ p.remove(); pins.delete(id); }
}

/* ---- three.js をカスタムレイヤーとして地図に重ねる ---- */
const avatarLayer = {
  id:'avatars', type:'custom', renderingMode:'3d',
  onAdd(m, gl){
    this.camera = new THREE.Camera(); this.scene = new THREE.Scene();
    this.scene.add(new THREE.HemisphereLight(0xffffff,0x8899aa,1.5));
    const dl = new THREE.DirectionalLight(0xffffff,1.7); dl.position.set(.5,1,1.2); this.scene.add(dl);
    this.renderer = new THREE.WebGLRenderer({canvas:m.getCanvas(), context:gl, antialias:true}); this.renderer.autoClear=false;
    this.groups = new Map(); this.sync();
  },
  sync(){
    if(!this.scene) return;
    const s = D().settings; this.origin = maplibregl.MercatorCoordinate.fromLngLat([s.officeLng,s.officeLat],0); this.unit = this.origin.meterInMercatorCoordinateUnits();
    for(const g of this.groups.values()) this.scene.remove(g); this.groups.clear();
    for(const r of D().restaurants){
      const pr = memberOf(r.createdBy); const who = r.status==='visited' ? visitorsOf(r.id) : (pr?[pr]:[]);
      if(!who.length) continue;
      const g = new THREE.Group(); const mc = maplibregl.MercatorCoordinate.fromLngLat([r.lng,r.lat],0);
      g.position.set((mc.x-this.origin.x)/this.unit, 0, (mc.y-this.origin.y)/this.unit); g.userData={lat:r.lat, mode:r.status};
      const n = who.length, rad = 30 + n*3.5;
      who.forEach((mem,i)=>{
        const a = makeAnimal(mem.animal); a.scale.setScalar(34);
        const ang = (r.status==='visited' ? (n===1 ? Math.PI/2 : (i/n)*Math.PI*2 + Math.PI/2) : Math.PI*.15 + (i/Math.max(n-1,1))*Math.PI*.7);
        const ox = Math.cos(ang)*rad, oz = (r.status==='visited' ? Math.sin(ang)*rad*.45 + rad*.5 + 30 : Math.sin(ang)*rad*.4 + 34);
        a.position.set(ox,0,oz); a.userData.phase = i*1.3 + Math.random(); a.userData.face = r.status==='visited' ? 0 : -ox/rad*.5;
        g.add(a);
      });
      if(r.status==='visited'){ // 旗と「楽しかった！」の吹き出し
        const pole = part('cy',0x666666,[0,22,-4],[.8,44,.8]); const flag = part('s',0xe8533f,[7,38,-4],[7,5,.6]); g.add(pole,flag); g.userData.flag=flag;
        const bb=bubble('楽しかった！', 1.7, .9, 0); g.children[0].userData.head.parent.add(bb); g.userData.bubbles=[bb]; }
      else { g.userData.mode='invite'; g.children[0].userData.face=0; const bb=bubble('おいでよ！', 1.7, .9, 0); g.children[0].userData.head.parent.add(bb); g.userData.bubbles=[bb]; }   // 提案した人が1人で手招き
      this.scene.add(g); this.groups.set(r.id,g);
    }
    // 候補日にまだ答えていない人は、会社の前で「？」を出して待つ
    const una = unanswered(eventOf(monthKey()));
    // （会社の前の「？」）
    if(una.length){
      const g = new THREE.Group(); g.userData={lat:s.officeLat, mode:'ask'}; const n=una.length, rad=26+n*3;
      una.forEach((mem,i)=>{ const a=makeAnimal(mem.animal); a.scale.setScalar(30);
        const ang=Math.PI*.15+(i/Math.max(n-1,1))*Math.PI*.7, ox=Math.cos(ang)*rad, oz=Math.sin(ang)*rad*.4+30;
        a.position.set(ox,0,oz); a.userData.phase=i*1.1; a.userData.face=0;
        const q=new THREE.Mesh(new THREE.PlaneGeometry(.7,.7), new THREE.MeshBasicMaterial({map:qTex(), transparent:true, depthTest:false}));
        q.position.set(0,2.05,0); a.userData.head.parent.add(q); g.add(a); });
      this.scene.add(g); this.groups.set('__ask',g);
    }
    m_repaint();
  },
  render(gl, matrix){
    if(!this.origin) return;
    const z = map.getZoom(), t = performance.now()/1000;
    for(const g of this.groups.values()){
      const mpp = 40075016.686*Math.cos(g.userData.lat*Math.PI/180)/(512*2**z);
      g.scale.setScalar(mpp * avatarSize(z));
      for(const b of g.userData.bubbles||[]) b.visible = z>=15;
      const party = g.userData.mode==='visited';
      for(const a of g.children){ const u=a.userData; if(!u.body) continue; const p=t*1+u.phase;
        if(g.userData.mode==='invite'){ // 提案者がこちらを向いて手招き（おいでよ）
          u.body.position.y = Math.abs(Math.sin(p*2.5))*.06;
          u.arms[1].rotation.z = 1.2; u.arms[1].rotation.x = -.6 + Math.sin(p*6)*.6;       // 手のひらを前に出して、こっちこっちと振る
          u.arms[0].rotation.z = -.2; u.arms[0].rotation.x = 0; a.rotation.y = u.face + Math.sin(p*.8)*.25; u.head.rotation.z = Math.sin(p*3)*.1;
        } else if(party){ // みんなで喜ぶ：ジャンプしてバンザイ
          u.body.position.y = Math.abs(Math.sin(p*4))*.45;
          u.arms[0].rotation.z = -2.6 + Math.sin(p*8)*.3; u.arms[1].rotation.z = 2.6 - Math.sin(p*8)*.3;
          a.rotation.y = u.face + Math.sin(p*2)*.4; u.head.rotation.z = Math.sin(p*4)*.15;
        } else { // 行きたそうに：店の方を向いて、そわそわ＋ときどき手を挙げる
          const hop = (p % 3.2) < .45 ? Math.sin((p%3.2)/.45*Math.PI)*.35 : 0;
          u.body.position.y = Math.abs(Math.sin(p*5))*.05 + hop;
          a.rotation.y = u.face + Math.sin(p*1.7)*.35;
          const raise = (p % 6) < 2 ? 1 : 0;
          u.arms[1].rotation.z = THREE.MathUtils.lerp(u.arms[1].rotation.z, raise? 2.5 + Math.sin(p*10)*.25 : .15, .15);
          u.arms[0].rotation.z = -.15 - Math.abs(Math.sin(p*5))*.15; u.head.rotation.z = Math.sin(p*1.7)*.12;
        }
        if(u.drapes) u.drapes.forEach((d,i)=>d.rotation.z = -.7*u.arms[i].rotation.z); // 浴衣のそでは垂れ下がる
      }
      if(g.userData.flag) g.userData.flag.rotation.y = Math.sin(t*3)*.3;
    }
    const s = this.unit, o = this.origin;
    const l = new THREE.Matrix4().makeTranslation(o.x,o.y,o.z).scale(new THREE.Vector3(s,-s,s)).multiply(new THREE.Matrix4().makeRotationX(Math.PI/2));
    this.camera.projectionMatrix = new THREE.Matrix4().fromArray(matrix).multiply(l);
    this.renderer.resetState(); this.renderer.render(this.scene,this.camera);
    map.triggerRepaint();
  }
};

const snapH = s => s==='peek' ? 232 : s==='half' ? Math.round(innerHeight*.5) : Math.round(innerHeight*.88);
function setSnap(sn){ snap=sn; const h=snapH(sn); $('#sheet').style.height=h+'px';
  document.documentElement.style.setProperty('--sh', (innerWidth>=768?16:0)+h+'px'); document.body.classList.toggle('full', sn==='full'); }

  sheetState.kind=kind; sheetState.id=id; $('#sheetBody').scrollTop = top;

// つまみ部分を上下にドラッグして高さを変える。軽くタップすると一段ずつ切り替え
(()=>{ const sh=$('#sheet'), hd=$('#shead'); let y0=null, h0=0, moved=false;
  hd.addEventListener('pointerdown', e=>{ y0=e.clientY; h0=sh.getBoundingClientRect().height; moved=false; });
  addEventListener('pointermove', e=>{ if(y0==null) return; const dy=e.clientY-y0; if(Math.abs(dy)>6){ moved=true; sh.classList.add('drag'); }
    if(moved) sh.style.height = Math.min(snapH('full'), Math.max(120, h0-dy))+'px'; });
  addEventListener('pointerup', e=>{ if(y0==null) return; const was=moved; y0=null; sh.classList.remove('drag'); if(!was) return;
    const h=sh.getBoundingClientRect().height; const best=['peek','half','full'].sort((a,b)=>Math.abs(snapH(a)-h)-Math.abs(snapH(b)-h))[0]; setSnap(best);
    hd.addEventListener('click', ev=>{ ev.stopPropagation(); ev.preventDefault(); }, {capture:true, once:true}); });
  const cycle=()=>setSnap(snap==='peek'?'half':snap==='half'?'full':'peek');
  $('#grip').addEventListener('click', cycle); $('#grip').addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); cycle(); } });
  addEventListener('resize', ()=>setSnap(snap));
})();

function openShop(id, keep){
  const r = D().restaurants.find(x=>x.id===id); if(!r){ closeSheet(); return; }
  const visitors = visitorsOf(id), pr = memberOf(r.createdBy), mine = pr && me && pr.id===me.id;
  const link = /^https?:\/\//.test(r.url||'') ? `<p><a href="${esc(r.url)}" target="_blank" rel="noopener">お店のページを開く</a></p>` : '';
  const html = `<h2>${esc(r.name)}</h2>
    <div class="row"><span class="tag ${r.status}">${r.status==='visited'?'行った':'提案中'}</span><span class="tag">${esc(r.genre||'ジャンル未設定')}</span>${r.budget?`<span class="tag">1人${yen(r.budget)}くらい</span>`:''}</div>
    ${pr?`<div class="who"><img src="${thumb(pr.animal)}" alt=""><span><span class="note">提案した人</span><br><b>${esc(pr.nickname)}</b>${mine?'（あなた）':''}</span></div>`:''}
    <h3>推しポイント</h3>${r.pitch?`<div class="pitch">${esc(r.pitch)}</div>`:`<p class="note">まだ書かれていません</p>`}
    ${mine?`<button class="btn ghost" data-a="pitch">推しポイントを${r.pitch?'直す':'書く'}</button>`:''}
    ${link}
    ${r.status==='visited'
      ? `<h3>行ったメンバー（${visitors.length}人）</h3>${faces(visitors)}
         <div class="row" style="margin-top:16px"><button class="btn ghost" data-a="editVisit">参加者を直す</button><button class="btn ghost" data-a="unvisit">提案中に戻す</button></div>`
      : `<div class="row" style="margin-top:16px"><button class="btn done" data-a="visit">行った！にする</button></div>`}
    <div class="row" style="margin-top:24px"><button class="btn ghost" data-a="move">位置を直す</button><button class="btn ghost" data-a="del">削除</button></div>`;
  openSheet(html,'shop',id);
  if(!keep) map.easeTo({center:[r.lng,r.lat], offset:[0,-120], duration:600});
  const on = (a,f)=>{ const b=$(`#sheetBody [data-a=${a}]`); if(b) b.onclick=f; };

  on('unvisit', async()=>{ await store.setVisits(id,[]); await store.updateRestaurant(id,{status:'wish'}); });
  on('move', ()=>startPick('店の位置に合わせてください', [r.lng,r.lat], async c=>{ await store.updateRestaurant(id,{lat:c.lat,lng:c.lng}); openShop(id); }));
  on('del', async()=>{ const vis=D().visits.filter(v=>v.r===id).map(v=>v.m), evs=T('events').filter(e=>e.restaurant_id===id).map(e=>e.id), s0={...r};
    await store.deleteRestaurant(id); closeSheet();
    offerUndo(`「${r.name}」を削除しました`, async()=>{ const n=await store.addRestaurant({name:s0.name,url:s0.url,genre:s0.genre,lat:s0.lat,lng:s0.lng,budget:s0.budget,createdBy:s0.createdBy,pitch:s0.pitch});
      if(s0.status==='visited'){ await store.updateRestaurant(n.id,{status:'visited'}); await store.setVisits(n.id,vis); }
      for(const e of evs) await store.upd('events',e,{restaurant_id:n.id}); openShop(n.id); }); });
}

/* ---- 店の登録：URLを貼る → 分かる範囲で自動入力 → 位置を確認 ---- */
const BADNAME = /^(google\s*(maps|マップ)?|googleマップ|食べログ|ホットペッパーグルメ|hot\s*pepper.*)$/i;
function parseShopUrl(u){
  const out = {};
  try{
    // 共有ボタンでは「店名 + URL」の形で貼られることがあるので、URLの部分だけ取り出す
    const mu = String(u).match(/https?:\/\/\S+/); if(!mu) return out;
    const pre = String(u).slice(0,mu.index).replace(/\s+/g,' ').trim(); if(pre && !BADNAME.test(pre)) out.name = pre.slice(0,60);
    const url = new URL(mu[0]); const s = decodeURIComponent(url.href); out.url = url.href;
    let m = s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || s.match(/[?&](?:q|ll|query)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/);
    if(m){ out.lat=+m[1]; out.lng=+m[2]; }
    m = s.match(/\/maps\/place\/([^/@?]+)/); if(m) out.name = m[1].replace(/\+/g,' ');
    else if(!out.name){ const q = url.searchParams.get('q')||url.searchParams.get('query'); if(q && !/^-?\d+\.\d+,|^(place_id|cid|ftid):/i.test(q)) out.name = q.split(/[,、]/)[0].trim(); }
    out.host = url.hostname;
  }catch{}
  return out;
}
// お店の説明の言葉から、アプリのジャンルに当てはめる
function toGenre(t){
  t = String(t||''); if(!t.trim()) return '';
  const rules = [['寿司',/寿司|鮨|すし/],['焼肉',/焼肉|ホルモン|焼き肉/],['ラーメン',/ラーメン|つけ麺|拉麺/],['カレー',/カレー/],['中華',/中華|餃子|四川|広東|点心|飲茶|小籠包/],
    ['イタリアン',/イタリア|パスタ|ピザ|ピッツァ|トラットリア|リストランテ/],['フレンチ',/フレンチ|フランス|ビストロ/],['エスニック',/タイ料理|ベトナム|インド|韓国|アジア|エスニック|ネパール|メキシコ|スペイン/],
    ['居酒屋',/居酒屋|焼鳥|焼き鳥|やきとり|串|ダイニングバー|バル|ビアホール|立ち飲み/],['和食',/和食|日本料理|割烹|懐石|会席|そば|蕎麦|うどん|天ぷら|とんかつ|うなぎ|しゃぶ|すき焼|鍋|おでん|海鮮|魚介|料亭|小料理/]];
  for(const [g,re] of rules) if(re.test(t)) return g;
  return 'その他';
}
const midBudget = t => { const b=budgetRange(String(t||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248))); return b ? Math.round((b.lo+b.hi)/2/500)*500 || b.hi : null; };
// 店名と位置が分かったら、ホットペッパーで同じ店を探してジャンルと予算をもらう
async function hpDetails(name, lat, lng){
  if(!D().settings.hpKey || !name) return {};
  const key = n => String(n).replace(/[\s　・'’\-－]/g,'').toLowerCase();
  try{ const list = await hpFetch({keyword:name.split(/[\s　]/)[0], lat, lng, range:'2'});
    const hit = list.find(x=>key(x.name).includes(key(name)) || key(name).includes(key(x.name))) || (list.length===1?list[0]:null);
    if(!hit || distKm(lat,lng,+hit.lat,+hit.lng) > .3) return {};
    return {genre: toGenre((hit.genre?.name||'')+' '+(hit.genre?.catch||'')+' '+hit.name), budget: midBudget(hit.budget?.average||hit.budget?.name), source:'hp'}; }
  catch{ return {}; }
}
// URLのページを読んで、店名と位置を探す（食べログ・ホットペッパー・Googleマップの短いリンク）
async function lookupUrl(u){
  if(!store.rpc) return {};
  const d = await store.rpc('shop_page',{u:parseShopUrl(u).url||u}); if(!d || d.error) return {why:d?.error==='host'?'対応していないサイトです':'ページを読めませんでした'};
  const out = parseShopUrl(d.url||u), b = d.body||'';
  if(d.status && d.status!==200) out.why = `お店のページを読めませんでした（${d.status}）`;
  const pick = (...res)=>{ for(const re of res){ const m=b.match(re); if(m) return m; } return null; };
  // 食べログなどは、店の情報をまとめた部分（JSON-LD）を持っている
  for(const m of b.matchAll(/<script[^>]*application\/ld\+json[^>]*>([\s\S]*?)<\/script>/g)){
    let j; try{ j = JSON.parse(m[1]); }catch{ continue; }
    for(const o of [].concat(j, j['@graph']||[])){ if(!o || typeof o!=='object') continue;
      if(!(o.servesCuisine || o.priceRange || /Restaurant|FoodEstablishment|LocalBusiness/.test(String(o['@type'])))) continue;
      if(o.name && !out.name && !BADNAME.test(o.name)) out.name = String(o.name).trim();
      if(o.servesCuisine) out.genre = toGenre([].concat(o.servesCuisine).join(' ')+' '+(o.name||''));
      if(o.priceRange) out.budget = midBudget(o.priceRange);
      if(o.geo?.latitude && out.lat==null){ out.lat=+o.geo.latitude; out.lng=+o.geo.longitude; } } }
  if(!out.genre){ const k = pick(/<meta[^>]+name="keywords"[^>]+content="([^"]+)"/, /<meta[^>]+content="([^"]+)"[^>]+name="keywords"/); if(k){ const g=toGenre(k[1]); if(g!=='その他') out.genre=g; } }
  const ll = pick(/"latitude"\s*:\s*"?(-?\d{2}\.\d+)"?[^}]{0,120}?"longitude"\s*:\s*"?(-?\d{3}\.\d+)/, /center=(-?\d{2}\.\d+)(?:,|%2C)(-?\d{3}\.\d+)/, /[?&]ll=(-?\d{2}\.\d+),(-?\d{3}\.\d+)/,
    /data-lat="(-?\d{2}\.\d+)"[^>]*data-lng="(-?\d{3}\.\d+)"/, /lat[=:]\s*"?(-?\d{2}\.\d{4,})"?[,&\s]+(?:lng|lon)[=:]\s*"?(-?\d{3}\.\d{4,})/, /@(-?\d{2}\.\d+),(-?\d{3}\.\d+)/);
  if(ll && out.lat==null){ out.lat=+ll[1]; out.lng=+ll[2]; }
  if(!out.name){
    const res = [/<meta[^>]+content="([^"]+)"[^>]+itemprop="name"/, /<meta[^>]+itemprop="name"[^>]+content="([^"]+)"/, /<meta[^>]+property="og:title"[^>]+content="([^"]+)"/, /<meta[^>]+content="([^"]+)"[^>]+property="og:title"/, /<title>([^<]+)<\/title>/];
    for(const re of res){ const m=b.match(re); if(!m) continue;
      const n = m[1].replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/&quot;/g,'"').split(/ · | - | \| |（|\(|【/)[0].trim();
      if(n && !BADNAME.test(n)){ out.name=n; break; } }
  }
  return out;
}
// 店名から位置を探す（ホットペッパー → だめなら地図の地名検索）
async function findByName(name){
  const s=D().settings;
  try{ const r = await hpFetch({keyword:name, lat:s.officeLat, lng:s.officeLng, range:'5'}); if(r[0]) return {lat:+r[0].lat, lng:+r[0].lng, name:r[0].name, genre:toGenre((r[0].genre?.name||'')+' '+r[0].name), budget:midBudget(r[0].budget?.average||r[0].budget?.name)}; }catch{}
  try{ const v=`${s.officeLng-0.25},${s.officeLat+0.2},${s.officeLng+0.25},${s.officeLat-0.2}`;
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&bounded=1&viewbox=${v}&q=${encodeURIComponent(name)}`).then(x=>x.json());
    if(r[0]) return {lat:+r[0].lat, lng:+r[0].lon}; }catch{}
  return null;
}
let draft = null, draftPin = null;
// 入力中のお店の場所に、地図の上でピンを立てる（Googleマップで検索したときのように）
function showDraftPin(fly){
  if(!draft || draft.lat==null) return hideDraftPin();
  if(!draftPin){ const el=document.createElement('div'); el.className='dpin';
    el.innerHTML='<b></b><svg viewBox="0 0 40 40"><path d="M20 38 C20 38 6 22 6 14 a14 14 0 0 1 28 0 C34 22 20 38 20 38Z" fill="#e8533f" stroke="#fff" stroke-width="2"/><circle cx="20" cy="14" r="5" fill="#fff"/></svg>';
    draftPin = new maplibregl.Marker({element:el, anchor:'bottom'}); }
  draftPin.getElement().querySelector('b').textContent = (draft.name||'').trim();
  draftPin.setLngLat([draft.lng,draft.lat]).addTo(map);
  if(fly){ if(snap==='full') setSnap('half');
    map.easeTo({center:[draft.lng,draft.lat], zoom:Math.max(map.getZoom(),16), offset:[0,-Math.round(innerHeight*.25)], duration:800}); }
}
function hideDraftPin(){ if(draftPin){ draftPin.remove(); } }

  $('#fCancel').onclick = ()=>{ draft=null; closeSheet(); };

/* ============ P2：今月の会（幹事・候補日・当日・割り勘・提案） ============ */
const monthKey = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const monthLabel = k => { const [y,m]=k.split('-'); return `${y}年${+m}月`; };
const addMonth = (k,n) => { const [y,m]=k.split('-').map(Number); return monthKey(new Date(y, m-1+n, 1)); };
const WD = ['日','月','火','水','木','金','土'];
const dayLabel = iso => { const d=new Date(iso+'T00:00:00'); return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`; };
const yen = n => (Math.round(n)||0).toLocaleString('ja-JP') + '円';
const rotation = () => [...D().members].sort((a,b)=>(a.orderNo??999)-(b.orderNo??999) || a.nickname.localeCompare(b.nickname,'ja'));
const T = t => D()[t] || [];
let viewMonth = monthKey();

function eventOf(k){ return T('events').find(e=>e.month===k); }
// 幹事：その月の会に決まっていればその人。なければ、直前の会の幹事の次の人（順番表どおり）
function organizerFor(k){
  const ev = eventOf(k); if(ev && ev.organizer_id && memberOf(ev.organizer_id)) return memberOf(ev.organizer_id);
  const rot = rotation(); if(!rot.length) return null;
  const prev = T('events').filter(e=>e.month<k && e.organizer_id).sort((a,b)=>a.month<b.month?1:-1)[0];
  if(!prev) return rot[0];
  const gap = (()=>{ let n=0, x=prev.month; while(x<k && n<24){ x=addMonth(x,1); n++; } return n; })();
  const i = rot.findIndex(m=>m.id===prev.organizer_id);
  return rot[((i<0?-1:i) + gap) % rot.length];
}
async function ensureEvent(k){
  return eventOf(k) || await store.ins('events', {month:k, organizer_id:organizerFor(k)?.id||null, status:'planning'});
}
const datesOf = ev => ev ? T('event_dates').filter(d=>d.event_id===ev.id).sort((a,b)=>a.day<b.day?-1:1) : [];
const answersOf = dateId => T('date_answers').filter(a=>a.date_id===dateId);
const ansOf = (dateId,mid) => answersOf(dateId).find(a=>a.member_id===mid)?.ans;
// 候補日のどれにも答えていない人
function unanswered(ev){ const ds=datesOf(ev); if(!ds.length || ev.final_date_id || ev.status==='done') return []; return D().members.filter(m=>ds.some(d=>!ansOf(d.id,m.id))); }
function attendees(ev){ if(!ev?.final_date_id) return []; return answersOf(ev.final_date_id).filter(a=>a.ans!=='x').map(a=>memberOf(a.member_id)).filter(Boolean); }

function lineShare(text){ return 'https://line.me/R/share?text=' + encodeURIComponent(text); }

  const b = id => $('#'+id);

  document.querySelectorAll('#sheetBody [data-fix]').forEach(x=>x.onclick=()=>store.upd('events',ev.id,{final_date_id: ev.final_date_id===x.dataset.fix?null:x.dataset.fix}));

  const add=b('evAdd'); if(add) add.onclick=async()=>{ const v=b('evDay').value; if(!v){ toast('日付を選んでください'); return; } const e=await ensureEvent(k); if(datesOf(e).some(d=>d.day===v)){ toast('その日はもうあります'); return; } await store.ins('event_dates',{event_id:e.id, day:v}); };
  const sh=b('evShare'); if(sh) sh.addEventListener('click',()=>{ if(isOrg) store.upd('events',ev.id,{notified:true}); });
  const sv=b('evSave'); if(sv) sv.onclick=()=>store.upd('events',ev.id,{meet_time:b('evTime').value.trim(), meet_place:b('evPlace').value.trim()});
  const calc=()=>{ const t=+b('evTotal').value.replace(/[^\d]/g,''), h=+b('evHead').value.replace(/[^\d]/g,''), u=+b('evUnit').value; const p=t&&h?Math.ceil(t/h/u)*u:0;
    b('evPer').textContent = p?`1人 ${yen(p)}`:'合計と人数を入れてください'; b('evRest').textContent = p?`集める合計 ${yen(p*h)}（差額 ${yen(p*h-t)}）`:''; return {t,h,u}; };
  if(b('evTotal')){ ['evTotal','evHead','evUnit'].forEach(i=>b(i).addEventListener('input',calc)); b('evCalc').onclick=()=>{ const {t,h,u}=calc(); store.upd('events',ev.id,{total:t||null, headcount:h||null, round_unit:u, paid: t>0}); toast('保存しました'); }; }
  if(b('evPick')) b('evPick').onclick=()=>pickShopSheet(k);
  if(b('evSuggest')) b('evSuggest').onclick=()=>suggestSheet(k);

  if(b('evDone')) b('evDone').onclick=async()=>{ const ids=att.map(m=>m.id); if(!ids.length){ toast('参加者がいません'); return; }

/* ---- ルーレット：結果は幹事にだけ見せ、「この店に決める」で確定 ---- */

  if(rs.length<2){ toast('提案された店が2つ以上必要です'); return; }
  openSheet(`<h2>迷ったらルーレット</h2><p class="note">候補にする店を選んでください。結果はあなたにだけ表示されます。</p>
    ${rs.map((r,i)=>`<label class="chk"><input type="checkbox" value="${esc(r.id)}" ${i<5?'checked':''}>${esc(r.name)}</label>`).join('')}
    <div class="wheel" id="rlBox">？</div>
    <div class="row"><button class="btn ghost" id="rlBack">戻る</button><button class="btn pri" id="rlGo" style="flex:1">回す</button></div><div id="rlRes"></div>`,'roulette');
  $('#rlBack').onclick=eventSheet;
  $('#rlGo').onclick=()=>{ const ids=[...document.querySelectorAll('#sheetBody input:checked')].map(i=>i.value); if(ids.length<2){ toast('2つ以上選んでください'); return; }
    const names=ids.map(id=>D().restaurants.find(r=>r.id===id)); const win=names[Math.floor(Math.random()*names.length)];
    const box=$('#rlBox'); $('#rlGo').disabled=true; let n=0; const steps=18+Math.floor(Math.random()*6);
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const tick=()=>{ n++; const cur = n>=steps ? win : names[n%names.length]; box.textContent=cur.name; box.classList.toggle('hit', n>=steps);
      if(n<steps && !reduce) setTimeout(tick, 40 + n*n*0.9); else { $('#rlGo').disabled=false; $('#rlRes').innerHTML=`<button class="btn done wide" id="rlOk" style="margin-top:8px">この店に決める</button>`; $('#rlOk').onclick=()=>decideShop(k,win.id); } };
    reduce ? (n=steps-1, tick()) : tick(); };
}

/* ---- 店の自動提案（ホットペッパーグルメ グルメサーチAPI、JSONP） ---- */
async function hpFetch(params){
  // ふつうはデータベース（Supabase）からホットペッパーを呼ぶ。ブラウザから直接だと通らないことがあるため
  if(store.rpc){ let d; try{ d = await store.rpc('hp_search',{q:params}); }
    catch(e){ throw new Error(/hp_search|function/.test(String(e.message||e)) ? 'データベースの追加設定（SQL）がまだです' : String(e.message||e)); }
    if(d?.error) throw new Error(d.error==='no key'?'APIキーが入っていません':String(d.error));
    if(d?.results?.error) throw new Error(d.results.error[0]?.message||'APIキーを確かめてください');
    return d?.results?.shop||[]; }
  return hpJsonp(params);
}
function hpJsonp(params){
  return new Promise((ok,ng)=>{ const cb='hp'+Math.random().toString(36).slice(2); const sc=document.createElement('script');
    const q=new URLSearchParams({key:D().settings.hpKey, format:'jsonp', callback:cb, count:'50', ...params});
    const to=setTimeout(()=>{ cleanup(); ng(new Error('timeout')); },10000);
    const cleanup=()=>{ clearTimeout(to); delete window[cb]; sc.remove(); };
    window[cb]=d=>{ cleanup(); d?.results?.error ? ng(new Error(d.results.error[0]?.message||'error')) : ok(d?.results?.shop||[]); };
    sc.onerror=()=>{ cleanup(); ng(new Error('network')); };
    sc.src='https://webservice.recruit.co.jp/hotpepper/gourmet/v1/?'+q; document.head.appendChild(sc); });
}
const budgetRange = s => { const n=String(s||'').replace(/,/g,'').match(/\d+/g)?.map(Number)||[]; return n.length?{lo:n[0], hi:n[n.length-1]}:null; };
function distKm(a,b,c,d){ const R=6371, x=(c-a)*Math.PI/180, y=(d-b)*Math.PI/180; const h=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
let lastSuggest = [];
function suggestSheet(k){ searchSheet('event', k); }
function searchSheet(from, k=monthKey()){
  const s=D().settings, ev=eventOf(k), att=attendees(ev), org=organizerFor(k), isOrg=org&&me&&org.id===me.id;
  const back=()=>from==='add'?addForm():from==='list'?showTab('list'):eventSheet();
  if(!s.hpKey){ openSheet(`<h2>店を探す</h2><p>この機能には、ホットペッパーグルメのAPIキー（無料）が必要です。管理する人が「設定 → チームの設定」にキーを入れると使えるようになります。</p><button class="btn ghost wide" id="sgBack" style="margin-top:8px">戻る</button>`,'suggest');
    $('#sgBack').onclick=back; return; }
  openSheet(`<h2>店を探す</h2><p class="note">会社と、登録した駅の周り（徒歩圏）から、人数が入れて予算に合う店を探します。行ったことのある店と、みんなの苦手な食べ物の店は外します。</p>
    <div class="row"><label class="f" style="flex:1">1人の予算（円）<input type="text" inputmode="numeric" id="sgBud" value="5000"></label><label class="f" style="flex:1">人数<input type="text" inputmode="numeric" id="sgNum" value="${att.length||D().members.length}"></label></div>
    <div class="row"><label class="f" style="flex:1">ジャンル<select id="sgGenre"><option value="">こだわらない</option>${GENRES.filter(g=>g!=='その他').map(g=>`<option>${g}</option>`).join('')}</select></label><label class="chk" style="flex:1;margin-top:24px"><input type="checkbox" id="sgRoom">個室あり</label></div>
    <button class="btn pri wide" id="sgGo" style="margin-top:8px">探す</button><div id="sgOut"></div><button class="btn ghost wide" id="sgBack" style="margin-top:16px">戻る</button>`,'suggest');
  $('#sgBack').onclick=back;
  $('#sgGo').onclick=async()=>{ const bud=+$('#sgBud').value.replace(/[^\d]/g,'')||0, num=+$('#sgNum').value.replace(/[^\d]/g,'')||1, gen=$('#sgGenre').value, room=$('#sgRoom').checked; const out=$('#sgOut'); out.innerHTML='<p class="note">探しています…</p>';
    const spots=[{lat:s.officeLat,lng:s.officeLng}, ...(s.stations||[])];
    let shops=[]; try{ const rs=await Promise.all(spots.map(p=>hpFetch({lat:p.lat,lng:p.lng,range:'3',party_capacity:String(num),...(room?{private_room:'1'}:{})}))); shops=rs.flat(); }
    catch(e){ out.innerHTML=`<p class="err">お店を取得できませんでした（${esc(e.message)}）。</p>`; return; }
    const seen=new Set(); shops=shops.filter(x=>!seen.has(x.id)&&seen.add(x.id));
    const vis=D().restaurants.filter(r=>r.status==='visited'), wish=D().restaurants.filter(r=>r.status==='wish');
    const people=(att.length?att:D().members); const ng=people.flatMap(m=>(m.dislikes||'').split(/[、,，\s・\/]+/)).map(x=>x.trim()).filter(x=>x.length>=2);
    const recentG=new Set(T('events').filter(e=>e.restaurant_id).sort((a,b)=>a.month<b.month?1:-1).slice(0,3).map(e=>D().restaurants.find(r=>r.id===e.restaurant_id)?.genre).filter(Boolean));
    const scored=shops.map(x=>{ const br=budgetRange(x.budget?.name||x.budget?.average); const lat=+x.lat, lng=+x.lng; const g=x.genre?.name||'';
      if(bud && br && br.lo>bud) return null;                                   // 予算オーバー
      if(gen && !(g+(x.genre?.catch||'')+x.name).includes(gen.replace('エスニック','アジア'))) return null; // ジャンル指定
      if(vis.some(v=>v.name===x.name || distKm(v.lat,v.lng,lat,lng)<0.03)) return null; // 行ったことがある
      const text=g+' '+(x.genre?.catch||'')+' '+(x.catch||''); if(ng.some(w=>text.includes(w))) return null; // 苦手に当たる
      let sc=0; const w=wish.find(v=>v.name===x.name || distKm(v.lat,v.lng,lat,lng)<0.03); if(w) sc+=100;
      if(![...recentG].some(rg=>g.includes(rg)||rg.includes(g))) sc+=20;      // 最近行っていないジャンル
      const near=vis.length?Math.min(...vis.map(v=>distKm(v.lat,v.lng,lat,lng))):9; sc+=Math.min(near,2)*10; // まだ行っていないエリア
      return {x,sc,br,lat,lng,g}; }).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,5);
    lastSuggest=scored;
    out.innerHTML = scored.length ? `<ul class="list">${scored.map((o,i)=>`<li style="align-items:flex-start">${o.x.photo?.mobile?.s?`<img src="${esc(o.x.photo.mobile.s)}" alt="" style="border-radius:10px">`:''}<div style="flex:1"><b>${esc(o.x.name)}</b><br><span class="note">${esc(o.g)}　${esc(o.x.budget?.name||'')}<br>${esc(o.x.station_name?o.x.station_name+'駅':'')} ${esc(o.x.mobile_access||'')}</span>
      <div class="row" style="margin-top:6px"><a class="mini" href="${esc(o.x.urls?.pc||'#')}" target="_blank" rel="noopener">お店のページ</a><button class="mini" data-w="${i}">提案する</button>${isOrg&&from==='event'?`<button class="mini" data-k="${i}">この店に決める</button>`:''}</div></div></li>`).join('')}</ul><p class="note">Powered by <a href="http://webservice.recruit.co.jp/" target="_blank" rel="noopener">ホットペッパーグルメ Webサービス</a></p>`
      : '<p class="note">条件に合うお店が見つかりませんでした。予算か人数を変えてみてください。</p>';
    const toShop=async i=>{ const o=lastSuggest[i]; const ex=D().restaurants.find(r=>r.name===o.x.name); if(ex) return ex;
      const br=o.br; const r=await store.addRestaurant({name:o.x.name,url:o.x.urls?.pc||'',genre:o.g,lat:o.lat,lng:o.lng,budget:br?Math.round((br.lo+br.hi)/2):null,createdBy:me.id}); return r; };
    out.querySelectorAll('[data-w]').forEach(b=>b.onclick=async()=>{ await toShop(+b.dataset.w); toast('提案しました。推しポイントは店の画面から書けます'); b.disabled=true; });
    out.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{ const r=await toShop(+b.dataset.k); decideShop(k,r.id); });
  };
}

/* ============ 入口：合言葉 → 自分を選ぶ ============ */
function gate(){
  $('#gate').style.display='flex';
  const s = D().settings, first = !s.passHash;
  $('#gateBody').innerHTML = `<h1>ワンチーム<br>食事会マップ</h1>
    <p class="note">${first?'最初に、チームの合言葉を決めてください。':'チームの合言葉を入れてください。'}</p>
    <label class="f" for="gPass">合言葉</label><input type="password" id="gPass" autocomplete="current-password">
    <p class="err" id="gErr"></p><button class="btn pri wide" id="gOk">${first?'この合言葉で始める':'入る'}</button>
    ${store instanceof LocalStore?'<p class="note" style="margin-top:12px">デモの合言葉は「wanteam」です。</p>':''}`;
  const go = async()=>{ const v=$('#gPass').value; if(!v.trim()) return;
    const h = await sha(v);
    if(first){ await store.setPass(h); } else if(h!==D().settings.passHash){ $('#gErr').textContent='合言葉が違います'; return; }
    whoAmI(); };
  $('#gOk').onclick = go; $('#gPass').onkeydown = e=>{ if(e.key==='Enter') go(); };
}
function whoAmI(){
  const ms = D().members;
  $('#gateBody').innerHTML = `<h2 style="margin-top:0">あなたは誰ですか？</h2>
    ${ms.length?`<ul class="list">${ms.map(m=>`<li><img src="${thumb(m.animal)}" alt=""><button data-id="${esc(m.id)}"><b>${esc(m.nickname)}</b></button></li>`).join('')}</ul>`:''}
    <h3>はじめての人</h3><label class="f" for="gNick">ニックネーム（本名でなくてOK）</label><input type="text" id="gNick" maxlength="12">
    <p class="err" id="gErr"></p><button class="btn pri wide" id="gNew">次へ：動物を選ぶ</button>`;
  document.querySelectorAll('#gateBody [data-id]').forEach(b=>b.onclick=()=>enter(memberOf(b.dataset.id)));
  $('#gNew').onclick = ()=>{ const n=$('#gNick').value.trim();
    if(!n){ $('#gErr').textContent='ニックネームを入れてください'; return; }
    if(ms.some(m=>m.nickname===n)){ $('#gErr').textContent='その名前はもう使われています'; return; }
    animalPicker(null, async k=>enter(await store.addMember({nickname:n, animal:k}))); };
}
function enter(m){
  me = m; try{ localStorage.setItem(ME_KEY, m.id); }catch{}
  $('#gate').style.display='none'; setSnap('peek'); showTab('event'); refresh();
}
